name: Release

# Runs when VERSION changes on main (or manually). Creates tag v<VERSION> and a
# GitHub release whose notes are generated from the commit log, with a zip of
# the repository attached.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] \
            || { echo "Invalid VERSION: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check document versions
        run: |
          for f in README*.md; do
            grep -qE "[:：] ?${{ steps.v.outputs.version }}\s*$" "$f" \
              || { echo "$f does not end with version ${{ steps.v.outputs.version }}"; exit 1; }
          done

      - name: Skip if release exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create zip
        if: steps.exists.outputs.found != 'true'
        run: |
          git archive --format=zip --prefix="cpp_unittest_tips-${{ steps.v.outputs.version }}/" \
            -o "cpp_unittest_tips-${{ steps.v.outputs.version }}.zip" HEAD

      - name: Create tag and release
        if: steps.exists.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            "cpp_unittest_tips-${{ steps.v.outputs.version }}.zip" \
            --target "${{ github.sha }}" \
            --title "${{ steps.v.outputs.tag }}" \
            --generate-notes
